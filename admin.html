<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>점령치킨각 관리자</title>
<style>
:root{--bg:#f0f2f5;--bg2:#fff;--bg3:#f5f6f8;--text:#1a1d23;--dim:#6b7280;--border:#dde1e7;--red:#dc2626;--green:#16a34a;--gold:#92400e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;min-height:100vh;font-size:14px;}
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;text-align:center;}
.login-box h2{font-size:18px;font-weight:800;margin-bottom:6px;}
.login-box p{font-size:13px;color:var(--dim);margin-bottom:20px;}
input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 13px;font-size:16px;outline:none;margin-bottom:10px;}
.btn{width:100%;padding:12px;background:#1a1d23;color:#fff;font-weight:800;font-size:14px;border:none;border-radius:8px;cursor:pointer;}
.header{background:#1a1d23;padding:14px 20px;display:flex;align-items:center;gap:12px;}
.header img{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.header h1{color:#fff;font-size:15px;font-weight:800;}
.header span{color:#7c8ab0;font-size:12px;margin-left:auto;}
.content{padding:20px;max-width:700px;margin:0 auto;}
.section{background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.section-header{padding:12px 16px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.section-header h3{font-size:14px;font-weight:800;}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
.badge-pending{background:#fef3c7;color:#92400e;}
.badge-approved{background:#dcfce7;color:#166534;}
.member-list{}
.member-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.member-row:last-child{border-bottom:none;}
.member-nick{font-weight:700;flex:1;}
.member-time{font-size:11px;color:var(--dim);}
.btn-approve{padding:5px 12px;background:#dcfce7;color:#166534;border:1px solid #86efac;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-reject{padding:5px 12px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-kick{padding:5px 12px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.empty{padding:20px;text-align:center;color:var(--dim);font-size:13px;}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login" id="login-screen">
  <div class="login-box">
    <img src="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABh..." style="width:60px;height:60px;border-radius:50%;object-fit:cover;margin-bottom:12px">
    <h2>관리자 페이지</h2>
    <p>점령치킨각 길드 관리</p>
    <input type="password" id="admin-pw" placeholder="관리자 비밀번호" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="btn" onclick="adminLogin()">로그인</button>
  </div>
</div>

        <h3>✅ 승인된 멤버</h3>
        <span class="badge badge-approved" id="approved-count">0명</span>
      </div>
      <div class="member-list" id="approved-list">
        <div class="empty">승인된 멤버가 없어요</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOyVS9THJKwLmeNZF_zi7NmY_TzSjeU4o",
  authDomain: "sw-purekyh.firebaseapp.com",
  databaseURL: "https://sw-purekyh-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sw-purekyh",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 관리자 비밀번호 (여기서 변경하세요!)
const ADMIN_PW = "barcode1234";

window.adminLogin = function(){
  const pw = document.getElementById('admin-pw').value;
  if(pw === ADMIN_PW){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main').style.display='block';
    loadData();
    setInterval(()=>{
      document.getElementById('admin-time').textContent = new Date().toLocaleTimeString('ko-KR');
    }, 1000);
  } else {
    alert('비밀번호가 틀렸어요!');
  }
};

function timeAgo(ts){
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if(m < 1) return '방금';
  if(m < 60) return m+'분 전';
  const h = Math.floor(m/60);
  if(h < 24) return h+'시간 전';
  return Math.floor(h/24)+'일 전';
}

function loadData(){
  // 신청 목록
  onValue(ref(db,'pending'), snap=>{
    const val = snap.val();
    const list = document.getElementById('pending-list');
    const count = document.getElementById('pending-count');
    if(!val){list.innerHTML='<div class="empty">가입 신청이 없어요</div>';count.textContent='0명';return;}
    const entries = Object.values(val);
    count.textContent = entries.length+'명';
    list.innerHTML = entries.map(e=>`
      <div class="member-row">
        <div class="member-nick">👤 ${e.nick}</div>
        <div class="member-time">${timeAgo(e.requestedAt)}</div>
        <button class="btn-approve" onclick="approve('${e.nick}')">승인</button>
        <button class="btn-reject" onclick="reject('${e.nick}')">거절</button>
      </div>`).join('');
  });

  // 승인 목록
  onValue(ref(db,'approved'), snap=>{
    const val = snap.val();
    const list = document.getElementById('approved-list');
    const count = document.getElementById('approved-count');
    if(!val){list.innerHTML='<div class="empty">승인된 멤버가 없어요</div>';count.textContent='0명';return;}
    const entries = Object.values(val);
    count.textContent = entries.length+'명';
    list.innerHTML = entries.map(e=>`
      <div class="member-row">
        <div class="member-nick">✅ ${e.nick}</div>
        <div class="member-time">마지막: ${e.lastSeen ? timeAgo(e.lastSeen) : '-'}</div>
        <button class="btn-kick" onclick="kick('${e.nick}')">강퇴</button>
      </div>`).join('');
  });
}

window.approve = function(nick){
  set(ref(db,'approved/'+nick), {nick, approvedAt: Date.now()});
  remove(ref(db,'pending/'+nick));
};

window.reject = function(nick){
  if(!confirm(nick+' 님을 거절할까요?')) return;
  remove(ref(db,'pending/'+nick));
};

window.kick = function(nick){
  if(!confirm(nick+' 님을 강퇴할까요?')) return;
  remove(ref(db,'approved/'+nick));
};
</script>
</body>
</html>
