<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>점령전 공격 족보</title>
<style>
:root {
  --bg:#f0f2f5; --bg2:#ffffff; --bg3:#f5f6f8; --bg4:#eaecf0;
  --gold:#9a6f00; --gold2:#7a5500;
  --teal:#0891b2; --red:#dc2626; --purple:#7c3aed; --blue:#2563eb;
  --border:#dde1e7; --border2:#c8cdd6; --text:#1a1d23; --dim:#6b7280;
  --c-mul:#1d6fb5; --c-pung:#166534; --c-bul:#c2410c; --c-bit:#92400e; --c-am:#6d28d9;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Apple SD Gothic Neo','Segoe UI',sans-serif;min-height:100vh;font-size:14px;padding-bottom:env(safe-area-inset-bottom);}

/* 헤더 */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.logo{font-size:15px;font-weight:800;color:var(--gold);white-space:nowrap;}
.tier-tabs{display:flex;gap:5px;}
.tier-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none;transition:all .15s;}
.tier-tab.active{background:#1a1d23;border-color:#1a1d23;color:#fff;}
.header-btns{margin-left:auto;display:flex;gap:6px;}
.btn-io{padding:6px 11px;background:var(--bg3);color:var(--dim);border:1px solid var(--border2);border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.add-top{padding:7px 14px;background:#1a1d23;color:#fff;font-weight:800;font-size:13px;border:none;border-radius:8px;cursor:pointer;white-space:nowrap;}

/* 검색 */
.toolbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:9px 16px;position:sticky;top:53px;z-index:99;}
.search-box{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 13px;color:var(--text);font-size:16px;outline:none;width:100%;max-width:320px;-webkit-appearance:none;transition:border-color .15s;}
.search-box:focus{border-color:#1a1d23;}

/* 콘텐츠 */
.content{padding:20px 16px 40px;max-width:1100px;margin:0 auto;}

/* 상대덱 그룹 헤더 */
.group-block{margin-bottom:28px;}
.group-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.group-name{font-size:20px;font-weight:900;color:var(--text);letter-spacing:-0.3px;}
.enemy-chips{display:flex;gap:5px;flex-wrap:nowrap;}
.chip-enemy{background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c;border-radius:5px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap;}
.chip-none{font-size:12px;color:var(--dim);font-style:italic;}
.group-sep{flex:1;height:1px;background:var(--border2);min-width:20px;}
.group-add-btn{padding:5px 12px;background:#1a1d23;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}

/* 카드 그리드 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}

/* 카드 */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:box-shadow .15s;position:relative;}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);}
.card-top-bar{height:3px;}
.card-top-bar.r1{background:linear-gradient(90deg,#d97706,#f59e0b,transparent);}
.card-top-bar.r2{background:linear-gradient(90deg,#2563eb,#60a5fa,transparent);}
.card-top-bar.rw{background:linear-gradient(90deg,#7c3aed,#a78bfa,transparent);}

.card-body{padding:13px 14px 10px;flex:1;display:flex;flex-direction:column;gap:10px;}

/* 순위 + 공격멤버 */
.card-rank-row{display:flex;align-items:center;gap:8px;}
.rbadge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:4px;white-space:nowrap;flex-shrink:0;}
.rb1{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
.rb2{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;}
.rbw{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd;}

/* 아군 몹 칩 */
.chips{display:flex;gap:5px;flex-wrap:nowrap;}
.chip-my{border-radius:5px;padding:4px 10px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap;}
.chip-my.attr-mul{background:#dbeafe;color:var(--c-mul);border-color:#93c5fd;}
.chip-my.attr-pung{background:#dcfce7;color:var(--c-pung);border-color:#86efac;}
.chip-my.attr-bul{background:#ffedd5;color:var(--c-bul);border-color:#fdba74;}
.chip-my.attr-bit{background:#fef3c7;color:var(--c-bit);border-color:#fcd34d;}
.chip-my.attr-am{background:#ede9fe;color:var(--c-am);border-color:#c4b5fd;}
.chip-my.attr-etc{background:var(--bg4);color:var(--dim);border-color:var(--border2);}

/* 메모 */
.card-memo{font-size:12px;color:var(--dim);line-height:1.6;border-left:2px solid var(--border2);padding-left:8px;white-space:pre-line;}

/* ⋯ 메뉴 버튼 */
.card-menu-btn{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;-webkit-user-select:none;user-select:none;}
.card-menu-btn:active{background:var(--bg4);}
.card-menu-dropdown{position:absolute;top:36px;right:8px;background:#fff;border:1px solid var(--border2);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:50;min-width:90px;overflow:hidden;display:none;}
.card-menu-dropdown.open{display:block;}
.card-menu-item{padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.card-menu-item.edit{color:var(--text);}
.card-menu-item.edit:hover{background:var(--bg3);}
.card-menu-item.del{color:var(--red);}
.card-menu-item.del:hover{background:#fee2e2;}
/* 더보기 팝업 */
.memo-short{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;}
.memo-more-btn{font-size:11px;color:var(--teal);font-weight:700;cursor:pointer;margin-top:3px;display:inline-block;}
.memo-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.memo-popup-overlay.show{display:flex;}
.memo-popup{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:70vh;overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
@media(min-width:560px){.memo-popup-overlay{align-items:center;padding:20px;}.memo-popup{border-radius:14px;border:1px solid var(--border);max-height:60vh;}}
.memo-popup-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:10px;}
.memo-popup-content{font-size:13px;color:var(--dim);line-height:1.8;white-space:pre-line;}

/* 닉네임 입력 화면 */
.nick-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.nick-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;text-align:center;}
.nick-logo{font-size:32px;margin-bottom:8px;}
.nick-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px;}
.nick-sub{font-size:13px;color:var(--dim);margin-bottom:20px;}
.nick-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:12px 14px;color:var(--text);font-size:16px;outline:none;text-align:center;-webkit-appearance:none;margin-bottom:12px;}
.nick-input:focus{border-color:#1a1d23;}
.nick-btn{width:100%;padding:13px;background:#1a1d23;color:#fff;font-weight:800;font-size:15px;border:none;border-radius:10px;cursor:pointer;}
/* 현재 사용자 표시 */
.user-badge{font-size:12px;color:var(--dim);background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:3px 9px;margin-left:6px;}
/* 추가자 표시 */
.added-by{font-size:10px;color:var(--dim);margin-top:4px;}
.memo-popup-close{width:100%;margin-top:16px;padding:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;color:var(--dim);}

.empty{text-align:center;padding:60px 20px;color:var(--dim);}
/* 패치노트 팝업 */
.patch-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:20px;}
.patch-overlay.show{display:flex;}
.patch-box{background:#fff;border-radius:16px;width:100%;max-width:380px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.patch-header{background:#1a1d23;padding:18px 20px 14px;text-align:center;}
.patch-header-top{font-size:11px;font-weight:700;letter-spacing:2px;color:#7c8ab0;text-transform:uppercase;margin-bottom:6px;}
.patch-version{font-size:22px;font-weight:900;color:#fff;letter-spacing:-0.5px;}
.patch-body{padding:20px;}
.patch-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.patch-item:last-child{border-bottom:none;}
.patch-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.patch-text{font-size:13px;color:var(--text);line-height:1.6;flex:1;}
.patch-text strong{color:#1a1d23;font-weight:800;}
.patch-footer{padding:0 20px 20px;}
.patch-close{width:100%;padding:12px;background:#1a1d23;color:#fff;font-weight:800;font-size:14px;border:none;border-radius:10px;cursor:pointer;}
/* 즐겨찾기 */
.fav-btn{background:none;border:none;font-size:18px;cursor:pointer;padding:2px 4px;line-height:1;opacity:.35;transition:opacity .15s,transform .15s;flex-shrink:0;}
.fav-btn:active{transform:scale(1.3);}
.fav-btn.on{opacity:1;}
.fav-badge{font-size:10px;font-weight:800;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:middle;}
.empty .ico{font-size:32px;margin-bottom:10px;}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px 16px 0 0;border-top:1px solid var(--border);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
@media(min-width:560px){.overlay{align-items:center;padding:20px;}.modal{border-radius:14px;border:1px solid var(--border);max-height:88vh;}}
.modal-drag{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px;}
.modal-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:16px;}
.flabel{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin-bottom:5px;margin-top:14px;}
input[type=text]{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;color:var(--text);font-size:16px;outline:none;-webkit-appearance:none;transition:border-color .15s;}
input[type=text]:focus{border-color:#1a1d23;}
textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;color:var(--text);font-size:16px;outline:none;resize:vertical;min-height:60px;font-family:inherit;-webkit-appearance:none;transition:border-color .15s;}
textarea:focus{border-color:#1a1d23;}
.rank-sel{display:flex;gap:7px;}
.ropt{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;text-align:center;-webkit-user-select:none;user-select:none;transition:all .15s;}
.ropt.s1{background:#fef3c7;border-color:#fcd34d;color:#92400e;}
.ropt.s2{background:#dbeafe;border-color:#93c5fd;color:#1e40af;}
.ropt.sw{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6;}
.mins{display:flex;gap:5px;}
.acw{position:relative;flex:1;}
.aclist{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #1a1d23;border-radius:8px;z-index:302;max-height:150px;overflow-y:auto;display:none;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch;}
.aclist.open{display:block;}
.acitem{padding:10px 12px;font-size:14px;cursor:pointer;color:var(--text);}
.acitem:hover,.acitem:active{background:var(--bg3);}
.mbtns{display:flex;gap:8px;margin-top:18px;}
.btn-save{flex:1;padding:13px;background:#1a1d23;color:#fff;font-weight:800;font-size:15px;border:none;border-radius:10px;cursor:pointer;}
.btn-cancel{padding:13px 14px;background:var(--bg3);color:var(--dim);font-weight:700;font-size:14px;border:1px solid var(--border2);border-radius:10px;cursor:pointer;}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}

@media(max-width:480px){
  .card-grid{grid-template-columns:1fr 1fr;}
  .mins{flex-wrap:wrap;}.acw{min-width:calc(33% - 4px);}
}
@media(max-width:360px){
  .card-grid{grid-template-columns:1fr;}
}

/* 배너 */
.top-banner{background:linear-gradient(135deg,#fff5f5,#fff0f8,#f5f0ff);border-bottom:1px solid #ffd6d6;padding:12px 20px;display:flex;align-items:center;gap:14px;}
.banner-img{width:56px;height:56px;object-fit:contain;border-radius:50%;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(255,100,100,.3));}
.banner-main{font-size:15px;font-weight:800;color:#c0392b;letter-spacing:-0.3px;}
.banner-sub{font-size:13px;color:#e74c3c;margin-top:3px;font-weight:600;}
</style>
<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOyVS9THJKwLmeNZF_zi7NmY_TzSjeU4o",
  authDomain: "sw-purekyh.firebaseapp.com",
  databaseURL: "https://sw-purekyh-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sw-purekyh",
  storageBucket: "sw-purekyh.firebasestorage.app",
  messagingSenderId: "490973153465",
  appId: "1:490973153465:web:bfee0fe0b70734e4a23368"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 전역으로 노출
window._fbDb = db;
window._fbRef = ref;
window._fbSet = set;
window._fbPush = push;
window._fbRemove = remove;
window._fbUpdate = update;
window._fbOnValue = onValue;
window._fbReady = true;

// DB 실시간 수신
const jokboRef = ref(db, 'jokbo');
onValue(jokboRef, (snapshot) => {
  const val = snapshot.val();
  if (val) {
    window.DB = Object.values(val);
    if (window._renderReady) window.render();
  }
});

// 즐겨찾기 실시간 수신 (계정별)
function loadFavs() {
  const nick = window.NICK;
  if (!nick) return;
  const favRef = ref(db, 'favs/' + nick);
  onValue(favRef, (snapshot) => {
    const val = snapshot.val();
    window.FAVS = new Set(val ? Object.values(val) : []);
    if (window._renderReady) window.render();
  });
}
window._loadFavs = loadFavs;
</script>
</head>

let FAVS=new Set(JSON.parse(localStorage.getItem('sw-favs')||'[]'));
function toggleFav(dname){
  if(FAVS.has(dname)) FAVS.delete(dname);
  else FAVS.add(dname);
  // Firebase에 즐겨찾기 저장
  if(window._fbReady && window.NICK){
    const obj={};
    [...FAVS].forEach((v,i)=>{ obj['f'+i]=v; });
    window._fbSet(window._fbRef(window._fbDb,'favs/'+window.NICK), obj);
  }
  render();
}

}

// 닉네임 시작
function startWithNick(){
  const nick = document.getElementById('nick-input').value.trim();
  if(!nick){ alert('닉네임을 입력해주세요.'); return; }
  window.NICK = nick;
  localStorage.setItem('sw-nick', nick);
  document.getElementById('nick-screen').style.display='none';
  document.getElementById('user-badge').textContent = '👤 '+nick;
  // Firebase에 접속 기록
  if(window._fbReady){
    const loginRef = window._fbRef(window._fbDb, 'users/'+nick);
    window._fbSet(loginRef, { nick, lastSeen: Date.now() });
    // 즐겨찾기 로드
    if(window._loadFavs) window._loadFavs();
  }
  window._renderReady = true;
  render();
}

function exportDB(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jokbo_backup.json';a.click();
  showToast('📥 백업 저장 완료');
}
function importDB(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{const data=JSON.parse(ev.target.result);if(!Array.isArray(data))throw new Error();
      DB=data;saveDB();render();showToast('✅ 불러오기 완료 — '+DB.length+'개');}
    catch{showToast('❌ 파일 형식 오류');}
  };
  r.readAsText(file);e.target.value='';
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

  const cont=document.getElementById('content');
  // 검색어 있으면 전체 tier에서, 없으면 현재 tier만
  let list = q
    ? DB.filter(d=>d.dname.toLowerCase().includes(q)||(d.enemy||[]).some(m=>m.toLowerCase().includes(q)))
    : DB.filter(d=>d.tier===tier);

  const groups={},order=[];
  list.forEach(d=>{
    if(!groups[d.dname]){groups[d.dname]={enemy:d.enemy||[],combos:[]};order.push(d.dname);}
    groups[d.dname].combos.push(d);
  });

  // 즐겨찾기 먼저 정렬
  order.sort((a,b)=>{
    const fa=FAVS.has(a)?0:1, fb=FAVS.has(b)?0:1;
    return fa-fb;
  });

  if(!order.length){
    cont.innerHTML='<div class="empty"><div class="ico">📭</div>조합이 없어요.<br><b>+ 추가</b>로 시작하세요.</div>';
    return;
  }

  const RO={'1':0,'2':1,'w':2};
  const RL={'1':'1순위','2':'2순위','w':'날빌성'};
  const RC={'1':'rb1','2':'rb2','w':'rbw'};
  const TB={'1':'r1','2':'r2','w':'rw'};

  cont.innerHTML=order.map(dname=>{
    const g=groups[dname];
    const combos=g.combos.slice().sort((a,b)=>(RO[a.rank]??9)-(RO[b.rank]??9));

    const enemyChips=g.enemy.length
      ? g.enemy.map(m=>`<span class="chip-enemy">${esc(m)}</span>`).join('')
      : `<span class="chip-none">상대 몹 미입력</span>`;

    const cards=combos.map(d=>{
      const myChips=d.my.map(m=>`<span class="chip-my ${attrClass(m)}">${esc(m)}</span>`).join('');
      const rawMemo=(d.memo||'').replace(/\\n/g,'\n');
      const LIMIT=60;
      const memoHtml=rawMemo
        ?(rawMemo.length>LIMIT
          ?`<div class="card-memo memo-short">${esc(rawMemo)}</div><span class="memo-more-btn" onclick="showMemo('${d.id}')">더보기 ▾</span>`
          :`<div class="card-memo">${esc(rawMemo)}</div>`)
        :'';
      return `<div class="card">
        <div class="card-top-bar ${TB[d.rank]||''}"></div>
        <button class="card-menu-btn" onclick="toggleMenu(event,'menu-${d.id}')">⋯</button>
        <div class="card-menu-dropdown" id="menu-${d.id}">
          <div class="card-menu-item edit" onclick="closeMenus();openModal('${d.id}')">✏ 편집</div>
          <div class="card-menu-item del" onclick="closeMenus();del('${d.id}')">삭제</div>
        </div>
        <div class="card-body">
          <div class="card-rank-row"><span class="rbadge ${RC[d.rank]}">${RL[d.rank]}</span></div>
          <div class="chips">${myChips}</div>
          ${d.addedBy?`<div class="added-by">추가: ${esc(d.addedBy)}</div>`:''}
          ${memoHtml}
        </div>
      </div>`;
    }).join('');

    return `<div class="group-block">
      <div class="group-header">
        <span class="group-name">${esc(dname)}</span>
        <button class="fav-btn ${FAVS.has(dname)?'on':''}" onclick="toggleFav('${esc(dname)}')">${FAVS.has(dname)?'⭐':'☆'}</button>
        ${FAVS.has(dname)?'<span class="fav-badge">즐겨찾기</span>':''}
        <div class="enemy-chips">${enemyChips}</div>
        <div class="group-sep"></div>
        <button class="group-add-btn" onclick="openForGroup('${esc(dname)}')">+ 추가</button>
      </div>
      <div class="card-grid">${cards}</div>
    </div>`;
  }).join('');
}

// 패치노트
const PATCH_VERSION = 'v26.06.11';
function showPatchIfNew(){
  const seen = localStorage.getItem('sw-patch');
  if(seen !== PATCH_VERSION){
    document.getElementById('patch-overlay').classList.add('show');
  }
}
function closePatch(){
  localStorage.setItem('sw-patch', PATCH_VERSION);
  document.getElementById('patch-overlay').classList.remove('show');
}

// 메뉴 토글
function toggleMenu(e,id){
  e.stopPropagation();
  const el=document.getElementById(id);
  const isOpen=el.classList.contains('open');
  closeMenus();
  if(!isOpen) el.classList.add('open');
}
function closeMenus(){
  document.querySelectorAll('.card-menu-dropdown.open').forEach(el=>el.classList.remove('open'));
}
document.addEventListener('click',closeMenus);

// 더보기 팝업
function showMemo(id){
  const d=DB.find(x=>x.id===id);
  if(!d) return;
  const overlay=document.getElementById('memo-popup-overlay');
  document.getElementById('memo-popup-title').textContent=d.dname+' / '+d.my.join(' · ');
  document.getElementById('memo-popup-content').textContent=(d.memo||'').replace(/\\n/g,'\n');
  overlay.classList.add('show');
}
function closeMemoPopup(){
  document.getElementById('memo-popup-overlay').classList.remove('show');
}

function setTier(t,el){
  tier=t;
  document.querySelectorAll('.tier-tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');render();
}

function openModal(id=null){
  eid=id;
  document.getElementById('mtitle').textContent=id?'조합 편집':'조합 추가';
  document.getElementById('f-dname').value='';document.getElementById('f-memo').value='';
  document.querySelectorAll('.ropt').forEach(o=>o.className='ropt');
  buildIns('enemy-ins',[]);buildIns('my-ins',[]);
  if(id){
    const d=DB.find(x=>x.id===id);
    if(d){
      document.getElementById('f-dname').value=d.dname;
      document.getElementById('f-memo').value=d.memo||'';
      buildIns('enemy-ins',d.enemy||[]);buildIns('my-ins',d.my||[]);
      const o=document.querySelector(`.ropt[data-r="${d.rank}"]`);if(o)selR(o);
    }
  }
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>document.getElementById('f-dname').focus(),80);
}
function openForGroup(dname){
  openModal(null);
  document.getElementById('f-dname').value=dname;
  const sample=DB.find(d=>d.dname===dname&&d.tier===tier);
  if(sample)buildIns('enemy-ins',sample.enemy||[]);
}
function closeModal(){document.getElementById('overlay').classList.remove('show');eid=null;}
function obg(e){if(e.target===document.getElementById('overlay'))closeModal();}

function buildIns(cid,vals){
  const c=document.getElementById(cid);c.innerHTML='';
  for(let i=0;i<3;i++){
    const aid=`${cid}-ac${i}`;
    const w=document.createElement('div');w.className='acw';
    w.innerHTML=`<input type="text" placeholder="${i+1}" value="${esc(vals[i]||'')}"
      oninput="acIn(this,'${aid}')" onblur="setTimeout(()=>acClose('${aid}'),180)" autocomplete="off" autocorrect="off">
      <div class="aclist" id="${aid}"></div>`;
    c.appendChild(w);
  }
}
function acIn(inp,aid){
  const q=inp.value.trim().toLowerCase(),list=document.getElementById(aid);
  if(!q){list.classList.remove('open');return;}
  const hits=getMONS().filter(m=>m.toLowerCase().includes(q)).slice(0,10);
  if(!hits.length){list.classList.remove('open');return;}
  list.innerHTML=hits.map(m=>`<div class="acitem" onmousedown="acPick(this,'${aid}')">${esc(m)}</div>`).join('');
  list.classList.add('open');
}
function acPick(el,aid){document.getElementById(aid).closest('.acw').querySelector('input').value=el.textContent;document.getElementById(aid).classList.remove('open');}
function acClose(aid){const el=document.getElementById(aid);if(el)el.classList.remove('open');}
function getMons(cid){return[...document.getElementById(cid).querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);}

function selR(el){document.querySelectorAll('.ropt').forEach(o=>o.className='ropt');el.classList.add(el.dataset.r==='1'?'s1':el.dataset.r==='2'?'s2':'sw');}
function getR(){const el=document.querySelector('.ropt.s1,.ropt.s2,.ropt.sw');return el?el.dataset.r:null;}

function doSave(){
  const dname=document.getElementById('f-dname').value.trim();
  const enemy=getMons('enemy-ins'),memo=document.getElementById('f-memo').value.trim();
  const my=getMons('my-ins'),rank=getR();
  const RO2={'1':0,'2':1,'w':2};
  if(!dname){alert('상대 덱 이름을 입력해주세요.');return;}
  if(!my.length){alert('공격 멤버를 입력해주세요.');return;}
  if(!rank){alert('추천도를 선택해주세요.');return;}
  if(eid){const i=DB.findIndex(x=>x.id===eid);if(i!==-1)DB[i]={id:eid,tier,dname,enemy,my,rank,memo};}
  else DB.push({id:uid(),tier,dname,enemy,my,rank,memo,addedBy:window.NICK||''});
  DB.sort((a,b)=>(RO2[a.rank]??9)-(RO2[b.rank]??9));
  saveDB();closeModal();render();
}
function del(id){if(!confirm('삭제할까요?'))return;DB=DB.filter(x=>x.id!==id);saveDB();render();}

window.onload=()=>{
  loadDB();
  const savedNick = localStorage.getItem('sw-nick');
  if(savedNick){
    window.NICK = savedNick;
    document.getElementById('nick-screen').style.display='none';
    document.getElementById('user-badge').textContent = '👤 '+savedNick;
    if(window._loadFavs) setTimeout(()=>window._loadFavs(), 500);
    window._renderReady = true;
  }
  render();
};
</script>
</body>
</html>
