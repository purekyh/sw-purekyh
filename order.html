<style>
:root{
  --bg:#fff7ec; --card:#fff; --ink:#1d1b1a; --sub:#7b7068; --line:#eddfc9;
  --brand:#ff5a4d; --brand-d:#e0443a; --ok:#1f9d63; --warn:#e8590c; --chip:#fff0dc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{padding:calc(22px + env(safe-area-inset-top,0px)) 0 8px}
.hero h1{font-size:clamp(19px,5.5vw,30px);line-height:1.3;margin:0 0 10px;font-weight:900;letter-spacing:-.02em;word-break:keep-all}
.hero h1 .logo{width:1.05em;height:1.05em;vertical-align:-.13em;margin-right:.18em;border-radius:22%}
.hero h1 .heart{color:var(--brand)}
.hero .sub{margin:0;font-size:15px;color:#4a423c;word-break:keep-all}
.hero .sub b{color:var(--brand-d)}
.banner{margin:14px 0 6px;padding:12px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.banner .t{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.banner.closed{background:#fff1f0;border-color:#ffc9c4;color:#b3261e}
.banner.soon .t{color:var(--warn)}
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:#5b524b;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cat-title{margin:20px 2px 8px;font-size:15px;font-weight:900;color:#5b524b}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.item.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(255,90,77,.12)}
.item img{width:84px;height:63px;object-fit:cover;border-radius:10px;background:#f4eee6;flex:0 0 auto}
.item .info{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15px;word-break:keep-all}
.sp{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sp span{font-size:11.5px;font-weight:700;background:var(--chip);border-radius:999px;padding:2px 8px;white-space:nowrap;color:#5b3a2a}
.ice{display:inline-block;font-size:11px;font-weight:800;color:#1c7ed6;background:#e7f1ff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.step{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:800;line-height:1;cursor:pointer;color:var(--ink)}
.step button.plus{background:var(--brand);border-color:var(--brand);color:#fff}
.step button:disabled{opacity:.35}
.step .q{min-width:18px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
h2.sec{font-size:20px;margin:30px 0 10px;font-weight:900;letter-spacing:-.01em}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--chip);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.chip b{color:var(--brand-d)}
.ord .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ord .who{font-weight:900;font-size:16px}
.ord .when{font-size:12px;color:var(--sub)}
.ord .what{margin-top:4px;font-size:14px;color:#3d352f;word-break:keep-all}
.x{border:none;background:none;color:#b3261e;font-size:13px;font-weight:700;cursor:pointer;padding:2px 4px;font-family:inherit}
details.hist{background:#fff;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;padding:0 14px}
details.hist summary{cursor:pointer;padding:13px 0;font-weight:800;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary small{color:var(--sub);font-weight:600}
details.hist .body{padding:0 0 12px}
.hist .row{padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.hist .row b{font-weight:900}
.admin{background:#16202e;color:#fff;border-radius:18px;padding:16px;margin:16px 0}
.admin h3{margin:0 0 10px;font-size:16px}
.admin label{font-size:13px;color:#b8c4d6;display:block;margin-bottom:6px}
.admin .r{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.admin input[type=datetime-local]{flex:1 1 200px;padding:10px;border-radius:10px;border:none;font-size:15px;font-family:inherit}
.btn{border:none;border-radius:12px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.btn.p{background:var(--brand);color:#fff}
.btn.g{background:#2a3a52;color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.4}
.admin .sum{font-size:14px;color:#d6dfec;margin:4px 0 12px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,247,236,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .cnt{flex:1;font-weight:800}
.bar .cnt small{display:block;color:var(--sub);font-weight:600;font-size:12px}
.bar .go{background:var(--brand);color:#fff;border:none;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
.bar .go:disabled{background:#cfc4b6}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet .li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sheet .nm-in{width:100%;margin:14px 0 6px;padding:14px;border-radius:12px;border:2px solid var(--line);font-size:17px;font-family:inherit;font-weight:700}
.sheet .nm-in:focus{outline:none;border-color:var(--brand)}
.sheet .hint{font-size:12px;color:var(--sub);margin:0 0 12px}
.sheet .btns{display:flex;gap:8px}
.sheet .btns .btn{flex:1;padding:14px}
.sheet .btns .btn.c{background:#eee;color:#333;flex:0 0 90px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:60;background:#222;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.foot{color:var(--sub);font-size:12px;text-align:center;margin:30px 0 10px}
</style>
</head>

const byId = Object.fromEntries(MENU.map(m=>[m.id,m]));
/* 500원 = 1스푼. 스푼마다 한 분씩 ♥ 한 스푼 */
const SPOON_WON = 500;
const TITLES = [
  {t:'대표님',e:'❤️'},{t:'이사님',e:'💛'},{t:'원장님',e:'💚'},{t:'팀장님',e:'💙'},{t:'실장님',e:'💜'}
];
const spoons = price => Math.max(1, Math.round(price/SPOON_WON));
/* 다섯 분이 고르게, 하지만 순서는 뒤죽박죽 (고정 시드라 모든 사람 화면에서 똑같이 보임) */
const SPOON_MAP = {};
(()=>{
  let seed=1851; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const total=MENU.reduce((a,m)=>a+spoons(m.price),0);
  const bag=Array.from({length:total},(_,i)=>i%TITLES.length);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
  let p=0;
  MENU.forEach(m=>{
    const k=spoons(m.price), mine=[];
    for(let n=0;n<k;n++,p++){
      if(mine.includes(bag[p])){ for(let q=p+1;q<bag.length;q++){ if(!mine.includes(bag[q])){[bag[p],bag[q]]=[bag[q],bag[p]];break} } }
      mine.push(bag[p]);
    }
    SPOON_MAP[m.id]=mine;
  });
})();
function spoonHTML(m){
  return SPOON_MAP[m.id].map(i=>`<span>${TITLES[i].t} ${TITLES[i].e} 한 스푼</span>`).join('');
}

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n=>'₩'+Number(n).toLocaleString('ko-KR');
const fmt = (ms,opt)=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',...opt}).format(new Date(ms));
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2600)}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,c.currentTime);o.start();o.stop(c.currentTime+.18)}catch(e){}}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const itemsOf = o => Object.values(o.items||{});
const cupsOf = list => list.reduce((a,o)=>a+itemsOf(o).reduce((b,i)=>b+(i.qty||0),0),0);
const spoonSum = list => list.reduce((a,o)=>a+itemsOf(o).reduce((b,i)=>b+(i.qty||0)*spoons(i.price||SPOON_WON),0),0);
function tallyOf(list){const m={};list.forEach(o=>itemsOf(o).forEach(i=>{m[i.name]=(m[i.name]||0)+(i.qty||0)}));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const itemsText = o => itemsOf(o).map(i=>`${i.name} ×${i.qty}`).join(', ');

/* ====== 관리자 ====== */
let admin=false;
if(ADMIN_PAGE){
  try{ if(sessionStorage.getItem('ddn_admin')===ADMIN_HASH) admin=true }catch(e){}

    const p=prompt('관리자 비밀번호');

    else if(p!==null) alert('비밀번호가 달라요');
  }
}

let offset=0, deadline=DEFAULT_DEADLINE, orders=[], history=[];
let cart={}; let curTab='전체';
let mine=lsGet('ddn_mine',[]);
let firstLoad=true; const seen=new Set();
const now=()=>Date.now()+offset;
const isClosed=()=>now()>=deadline;

/* ====== 메뉴 렌더 ====== */
function renderTabs(){
  const tabs=['전체',...CATS];
  $('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${t===curTab?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;renderTabs();renderMenu()});
}
function itemHTML(m){
  const q=cart[m.id]||0;
  return `<div class="item ${q?'sel':''}" data-id="${m.id}">
    <img src="${THUMBS[m.id]||''}" alt="">
    <div class="info"><div class="nm">${esc(m.name)}</div><div class="sp">${spoonHTML(m)}</div></div>
    <div class="step"><button class="minus" ${q?'':'style="visibility:hidden"'}>−</button><span class="q" ${q?'':'style="visibility:hidden"'}>${q}</span><button class="plus">+</button></div>
  </div>`;
}
function renderMenu(){
  const cats = curTab==='전체'?CATS:[curTab];
  $('#menu').innerHTML = cats.map(c=>`<div class="cat-title">${esc(c)}</div>`+MENU.filter(m=>m.cat===c).map(itemHTML).join('')).join('');
  $('#menu').querySelectorAll('.item').forEach(el=>{
    const id=el.dataset.id;
    el.querySelector('.plus').onclick=()=>changeQty(id,1);
    el.querySelector('.minus').onclick=()=>changeQty(id,-1);
  });
}
function changeQty(id,d){
  const q=Math.max(0,Math.min(20,(cart[id]||0)+d));
  if(q) cart[id]=q; else delete cart[id];
  renderMenu(); renderBar();
}
function cartItems(){return Object.entries(cart).map(([id,qty])=>({id,name:byId[id].name,price:byId[id].price,qty}))}
function renderBar(){
  const items=cartItems(); const n=items.reduce((a,i)=>a+i.qty,0);
  $('#barCnt').textContent = n? `담은 음료 ${n}잔` : '담은 음료 없음';
  $('#barSub').textContent = isClosed()? '주문이 마감됐어요' : (n? '이름 쓰고 주문하기를 눌러주세요' : '음료를 골라 + 를 눌러주세요');
  $('#goBtn').disabled = !n || isClosed();
}

/* ====== 주문 모달 / 제출 ====== */
$('#goBtn').onclick=()=>{
  const items=cartItems(); if(!items.length) return;
  $('#cartList').innerHTML=items.map(i=>`<div class="li"><span>${esc(i.name)} ×${i.qty}</span><span>${spoons(i.price)*i.qty}스푼</span></div>`).join('');
  $('#nameIn').value=lsGet('ddn_name','');
  $('#modal').classList.add('on');
  setTimeout(()=>$('#nameIn').focus(),50);
};
$('#cancelBtn').onclick=()=>$('#modal').classList.remove('on');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
$('#submitBtn').onclick=async()=>{
  const name=$('#nameIn').value.trim();
  if(!name){toast('이름을 꼭 써주세요!');$('#nameIn').focus();return}
  const items=cartItems(); if(!items.length) return;
  if(isClosed()){toast('앗, 방금 주문이 마감됐어요');$('#modal').classList.remove('on');return}
  const btn=$('#submitBtn'); btn.disabled=true;
  try{
    const r=push(ref(db,'orders/current'));
    await set(r,{name,items,ts:serverTimestamp()});
    mine.push(r.key); lsSet('ddn_mine',mine); lsSet('ddn_name',name);
    cart={}; renderMenu(); renderBar();
    $('#modal').classList.remove('on');
    toast(`${name}님 주문 완료! ♥`);
  }catch(e){
    console.error(e);
    toast('저장에 실패했어요. 잠시 후 다시 시도해주세요');
  }
  btn.disabled=false;
};

/* ====== 우리들의 구매목록 ====== */
function renderOrders(){
  const t=tallyOf(orders);
  $('#tally').innerHTML = t.length? t.map(([n,q])=>`<span class="chip">${esc(n)} <b>×${q}</b></span>`).join('') : '';
  const list=[...orders].sort((a,b)=>(b.ts||0)-(a.ts||0));
  $('#orders').innerHTML = list.length? list.map(o=>{
    const canCancel = !isClosed() && mine.includes(o.id);
    return `<div class="card ord"><div class="top"><span class="who">${esc(o.name)}</span><span class="when">${o.ts?fmt(o.ts,{hour:'numeric',minute:'2-digit'}):''} ${canCancel?`<button class="x" data-cancel="${o.id}">내 주문 취소</button>`:''}${admin?`<button class="x" data-del="${o.id}">삭제</button>`:''}</span></div><div class="what">${esc(itemsText(o))}</div></div>`;
  }).join('') : '<div class="empty">아직 주문이 없어요. 첫 번째 주인공이 되어주세요!</div>';
  $('#orders').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{
    if(!confirm('내 주문을 취소할까요?')) return;
    try{await remove(ref(db,'orders/current/'+b.dataset.cancel)); toast('주문을 취소했어요')}catch(e){toast('취소에 실패했어요')}
  });
  $('#orders').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('이 주문을 삭제할까요?')) return;
    try{await remove(ref(db,'orders/current/'+b.dataset.del))}catch(e){toast('삭제 실패')}
  });
}

/* ====== 지난 구매목록 ====== */
function renderHistory(){
  const list=[...history].sort((a,b)=>(b.completedAt||0)-(a.completedAt||0)).slice(0,30);
  $('#history').innerHTML = list.length? list.map((h,idx)=>{
    const os=Object.entries(h.orders||{}).map(([id,o])=>({id,...o})).sort((a,b)=>(a.ts||0)-(b.ts||0));
    const date=fmt(h.completedAt,{month:'long',day:'numeric',weekday:'short'});
    const time=fmt(h.completedAt,{hour:'numeric',minute:'2-digit'});
    const t=tallyOf(os).map(([n,q])=>`${esc(n)} ×${q}`).join(' · ');
    return `<details class="hist" ${idx===0?'open':''}><summary><span>${date} ${time} 접수 완료</span><small>${os.length}건 · ${cupsOf(os)}잔</small></summary><div class="body">${t?`<div class="row" style="border-top:none;color:#7b7068">${t}</div>`:''}${os.map(o=>`<div class="row"><b>${esc(o.name)}</b> — ${esc(itemsText(o))}${admin?` <button class="x" data-odel="${h.id}|${o.id}">삭제</button>`:''}</div>`).join('')}${admin?`<div class="row"><button class="x" data-hdel="${h.id}">🗑 이 기록 전체 삭제</button></div>`:''}</div></details>`;
  }).join('') : '<div class="empty">아직 지난 기록이 없어요</div>';
  $('#history').querySelectorAll('[data-hdel]').forEach(b=>b.onclick=async()=>{
    if(!confirm('이 접수 기록 전체를 삭제할까요?\n모든 사람 화면에서 사라지고 되돌릴 수 없어요.')) return;
    try{await remove(ref(db,'orders/history/'+b.dataset.hdel)); toast('기록을 삭제했어요')}catch(e){toast('삭제 실패')}
  });
  $('#history').querySelectorAll('[data-odel]').forEach(b=>b.onclick=async()=>{
    const [hid,oid]=b.dataset.odel.split('|');
    if(!confirm('이 주문을 지난 기록에서 삭제할까요?\n모든 사람 화면에서 사라져요.')) return;
    const h=history.find(x=>x.id===hid);
    try{
      if(h && Object.keys(h.orders||{}).length<=1) await remove(ref(db,'orders/history/'+hid));
      else await remove(ref(db,`orders/history/${hid}/orders/${oid}`));
      toast('삭제했어요');
    }catch(e){toast('삭제 실패')}
  });
}

/* ====== 관리자 패널 ====== */
function kstInputValue(ms){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
function renderAdmin(){
  if(!admin){$('#adminBox').innerHTML='';return}
  const people=new Set(orders.map(o=>o.name.trim())).size;
  const existing=$('#dlIn');
  const keep = existing && document.activeElement===existing ? existing.value : null;
  $('#adminBox').innerHTML=`<div class="admin"><h3>🛠 어드민</h3>
    <label>주문 마감 시간 (한국 시간)</label>
    <div class="r"><input type="datetime-local" id="dlIn" value="${keep||kstInputValue(deadline)}"><button class="btn p" id="dlSave">저장</button></div>
    <div class="r"><button class="btn g" id="dlPlus">+30분</button><button class="btn g" id="dlNow">지금 마감</button></div>
    <div class="sum">현재 ${people}명 · ${orders.length}건 · ${cupsOf(orders)}잔 · 총 ${spoonSum(orders)}스푼</div>
    <div class="r"><button class="btn g" id="copyBtn" ${orders.length?'':'disabled'}>📋 주문 내용 복사</button><button class="btn ok" id="doneBtn" ${orders.length?'':'disabled'}>✅ 접수 완료</button></div></div>`;
  $('#dlSave').onclick=async()=>{
    const v=$('#dlIn').value; if(!v){toast('시간을 선택해주세요');return}
    const ms=new Date(v+':00+09:00').getTime();
    try{await set(ref(db,'orders/settings/deadline'),ms); toast('마감 시간을 저장했어요')}catch(e){toast('저장 실패')}
  };
  $('#dlPlus').onclick=async()=>{try{await set(ref(db,'orders/settings/deadline'),Math.max(deadline,now())+30*60000); toast('30분 연장!')}catch(e){toast('저장 실패')}};
  $('#dlNow').onclick=async()=>{try{await set(ref(db,'orders/settings/deadline'),now()); toast('주문을 마감했어요')}catch(e){toast('저장 실패')}};
  $('#copyBtn').onclick=copyOrders;
  $('#doneBtn').onclick=completeOrders;
}
async function copyOrders(){
  const t=tallyOf(orders);
  const txt=`[음료 주문 ${fmt(now(),{month:'numeric',day:'numeric'})}] 총 ${cupsOf(orders)}잔\n\n■ 메뉴별\n${t.map(([n,q])=>`${n} x${q}`).join('\n')}\n\n■ 이름별\n${[...orders].sort((a,b)=>(a.ts||0)-(b.ts||0)).map(o=>`${o.name}: ${itemsText(o)}`).join('\n')}`;
  try{await navigator.clipboard.writeText(txt); toast('복사했어요')}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요')}catch(_){toast('복사 실패')}ta.remove()}
}
async function completeOrders(){
  if(!orders.length) return;
  const people=new Set(orders.map(o=>o.name.trim())).size;
  if(!confirm(`${people}명 · ${cupsOf(orders)}잔을 접수 완료 처리할까요?\n지금 목록은 지난 구매목록으로 이동해요.`)) return;
  const key=push(ref(db,'orders/history')).key;
  const data={}; orders.forEach(o=>{data[o.id]={name:o.name,items:o.items,ts:o.ts||0}});
  try{
    await update(ref(db),{[`orders/history/${key}`]:{completedAt:now(),orders:data},'orders/current':null});
    toast('접수 완료! 히스토리에 저장했어요');
  }catch(e){toast('접수 처리 실패')}
}

/* ====== 마감 배너 (1초마다) ====== */
function tick(){
  const left=deadline-now(); const b=$('#banner');
  const dl=fmt(deadline,{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'});
  if(left<=0){
    b.className='banner closed'; $('#bannerL').textContent=`주문 마감 (${dl})`; $('#bannerT').textContent='마감됐어요';
  }else{
    const s=Math.floor(left/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
    b.className='banner'+(left<15*60000?' soon':'');
    $('#bannerL').textContent=`주문 마감 ${dl}`;
    $('#bannerT').textContent=`${h?h+':':''}${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }
  renderBar();
}
setInterval(tick,1000);

/* ====== Firebase 실시간 구독 ====== */
onValue(ref(db,'.info/serverTimeOffset'),s=>{offset=s.val()||0;tick()});
onValue(ref(db,'orders/settings/deadline'),s=>{const v=s.val(); deadline=(typeof v==='number')?v:DEFAULT_DEADLINE; tick(); renderAdmin(); renderOrders()});
onValue(ref(db,'orders/current'),s=>{
  const v=s.val()||{};
  orders=Object.entries(v).map(([id,o])=>({id,...o}));
  if(admin && !firstLoad){
    const fresh=orders.filter(o=>!seen.has(o.id));
    if(fresh.length){ beep(); const o=fresh[fresh.length-1]; toast(`새 주문! ${o.name}님 (${cupsOf([o])}잔)`) }
  }
  orders.forEach(o=>seen.add(o.id)); firstLoad=false;
  if(admin) document.title=(orders.length?`(${orders.length}) `:'')+BASE_TITLE;
  renderOrders(); renderAdmin();
},e=>{console.error(e);toast('목록을 불러오지 못했어요')});
onValue(ref(db,'orders/history'),s=>{
  const v=s.val()||{}; history=Object.entries(v).map(([id,h])=>({id,...h})); renderHistory();
});

renderTabs(); renderMenu(); renderBar(); tick(); renderOrders(); renderHistory(); renderAdmin();
</script>
</body>
</html>
